[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segment-temporal"
version = "0.4.0"
description = "Fast media normalization, VAD segmentation, and keyframe extraction"
authors = [{ name = "Aron Homberg" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "click>=8.1,<9",
  "librosa==0.11.0",
  "numpy>=2.0,<3",
  "onnxruntime>=1.22,<2",
  "scipy>=1.11,<2",
  "silero-vad>=6.0,<7",
  "soundfile>=0.12,<1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
]

[project.scripts]
segment-temporal = "segment_temporal.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.16,<0.17",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
