[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segment-scenes"
version = "0.5.0"
description = "SoTA scene detection and segmentation for videos"
authors = [{ name = "Aron Homberg" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "click>=8.1",
  "fastapi>=0.116,<1",
  "numpy>=1.26",
  "tqdm>=4.66",
  "torch==2.8.0",
  "transnetv2-pytorch==1.0.5",
  "av>=12.0.0",
  "ffmpeg-python>=0.2.0",
  "Pillow>=10.0.0",
  "uvicorn[standard]>=0.35,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.16,<0.17",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[project.scripts]
segment-scenes = "segment_scenes.cli:main"

[tool.pytest.ini_options]
testpaths = ["test/unit"]
addopts = "-ra"
